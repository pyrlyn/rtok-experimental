[package]
name = "rtok-log"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
repository.workspace = true
description = "A rotating text log: one line format, a level floor, and a lock around rename"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] } # O_NOFOLLOW prevents rotation-lock symlink attacks
