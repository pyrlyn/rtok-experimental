[plugins.memory]
# enabled        = true
# recall_titles  = 5                    # SessionStart: last N titles + ids
# recall_tokens  = 200
# prompt_recall  = 5                    # UserPromptSubmit: 0 = off; N = ranked titles per turn
# checkpoint_tokens = 400               # PreCompact → SessionStart(compact)
# search_limit   = 5
# sync_tokens    = 300                  # rtok memory sync: CLAUDE.md / AGENTS.md block
# startup_recall = true                 # SessionStart(startup) restores newest session:* note
# handoff        = true                 # sub-agent digest MCP tool
# spawn_brief        = true             # SubagentStart pointer digest
