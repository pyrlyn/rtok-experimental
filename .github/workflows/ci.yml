name: ci

# Pull requests against main are the review gate: the `protect-main` ruleset requires a green
# `gate` before merge. A red main push (merge skew or a flake) is fixed forward; T502 retired
# the auto-revert job (T84), whose push to main that ruleset rejects. Draft PRs are skipped so
# half-finished work does not burn runners. `workflow_dispatch` remains for manual runs
# (release branches, one-off checks).
on:
  # Push to main, non-draft pull requests and the weekly schedule run this through
  # pipeline.yml (`workflow_call`), in parallel with the other checks and behind its `gate` job.
  workflow_call:
    inputs:
      docs-only:
        description: >-
          The change is documentation only (pipeline.yml's `changes` job, `docs-only` in
          .github/infra.yml): skip lint, check, windows and spa; `docs` runs instead.
        type: boolean
        required: false
        default: false
  workflow_dispatch:

# A newer commit on the same ref cancels the previous run. github.workflow names the caller
# (pipeline or Dependabot), so their runs of this workflow on one pull request do not cancel
# each other; the `ci-` prefix keeps the group apart from pipeline.yml's own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; jobs that cancel the run add `actions: write`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # T261: no DWARF for workspace code in CI (dependencies have none already, Cargo.toml).
  # Smaller test binaries, less for the linker to move. A panic message still names
  # file:line (`Location` is compiled in); backtrace frames lose it. Local builds keep
  # `line-tables-only`.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # nextest's `ci` profile (.config/nextest.toml): two retries, no fail-fast, so one timing flake
  # does not cancel the other shard and the macOS job. Reaches `just test` and the Windows run.
  NEXTEST_PROFILE: ci

jobs:
  # T261: everything that is not the test suite, once, on ubuntu, in parallel with `check`.
  # fmt, jscpd, oxlint and pytest do not depend on the OS; clippy here does not see
  # macOS-only `cfg` code, which the macOS test build still compiles.
  lint:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && !inputs.docs-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # cancel-run
    steps:
      - uses: actions/checkout@v7
      # Rust toolchain from the last run; mise then skips `rustup toolchain install`.
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: ./.github/actions/sccache
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # T261 experiment: also save on the branch's manual runs to measure a warm cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: just fmt-check lint build-min dup js python
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      # T23.6: `rtok-plugin-sdk` is published on release; a broken manifest fails here.
      - run: just publish-dry
      # T279: every plugin manifest and .rtok-plugin-version file must match Cargo.toml,
      # so a host that caches a plugin by its manifest version sees a new build.
      - run: tools/plugin-versions.sh --check "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
      - if: failure() && github.event_name == 'pull_request'
        uses: pyrlyn/ci/.github/actions/cancel-run@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  check:
    # Draft PRs still emit synchronize; skip until ready_for_review.
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && !inputs.docs-only
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
      actions: write # cancel-run
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Rust toolchain from the last run; mise then skips `rustup toolchain install`.
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      # Installs the Rust version pinned in mise.toml — same toolchain as local.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: ./.github/actions/sccache
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Skip slow cache upload on PRs; restore still works from main keys.
          # T261 experiment: also save on the branch's manual runs to measure a warm cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      # The host plugin tests (vitest) run on Linux only. Node and vitest themselves come from
      # the mise cache above (keyed on mise.toml); this keeps vitest's own cacheDir
      # (`vitest.config.mjs`) warm, keyed on the plugin sources.
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('mise.toml', 'vitest.config.mjs', 'plugins/**/*.ts') }}
          restore-keys: vitest-${{ runner.os }}-
      # T310.9: build.rs embeds web/dist, so build the SPA before cargo; without it the binary
      # carries the "UI not built" page and the SPA-serving tests only see the placeholder.
      - run: just spa-install spa-build
      # The suite itself runs in `build-tests` + `test` below (archive, 2 shards per OS); this job
      # keeps what needs the real binary: the Playwright e2e and the examples.
      - run: mise exec -- cargo build -q
      # T310.10: the Playwright e2e drives the target/debug/rtok that `cargo build` just built with the
      # SPA embedded. In the `spa` job it would need its own Rust toolchain and a cold cargo build;
      # here the cargo cache is already warm, and only Chromium is added.
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - if: runner.os == 'Linux'
        run: just spa-browsers spa-e2e-run
      - run: just example
      - if: failure() && github.event_name == 'pull_request'
        uses: pyrlyn/ci/.github/actions/cancel-run@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  # Unix test binaries are built once per OS and archived (`cargo nextest archive`); the `test`
  # shards below only download the archive and run their partition. Archive and run share one
  # runner OS and target. build.rs embeds web/dist, so the SPA is built first, as in `check`.
  build-tests:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && !inputs.docs-only
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write # cancel-run
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: ./.github/actions/sccache
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: just spa-install spa-build
      - run: mise exec -- cargo nextest archive --workspace --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive-${{ matrix.os }}
          path: nextest-archive.tar.zst
          retention-days: 1
          if-no-files-found: error
      - if: failure() && github.event_name == 'pull_request'
        uses: pyrlyn/ci/.github/actions/cancel-run@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  # The suite, split over 2 shards per OS (nextest `--partition count:i/n`) from the archive.
  test:
    needs: build-tests
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && !inputs.docs-only
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        partition: [1, 2]
        partitions: [2]
    name: test (${{ matrix.os }}, ${{ matrix.partition }}/${{ matrix.partitions }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write # cancel-run
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      # The host plugin tests (vitest) run on Linux only; keep vitest's cacheDir warm as in `check`.
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('mise.toml', 'vitest.config.mjs', 'plugins/**/*.ts') }}
          restore-keys: vitest-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive-${{ matrix.os }}
      - run: >-
          mise exec -- cargo nextest run --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --partition count:${{ matrix.partition }}/${{ matrix.partitions }}
      - if: failure() && github.event_name == 'pull_request'
        uses: pyrlyn/ci/.github/actions/cancel-run@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  # The Windows test binaries are built once here and archived (`cargo nextest archive`); the
  # `windows` shards below only download the archive and run their partition, so the build is
  # no longer repeated per shard. Archive and run share one runner OS and target.
  windows-build:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && !inputs.docs-only
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write # cancel-run
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: ./.github/actions/sccache
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise exec -- cargo nextest archive --workspace --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive-windows
          path: nextest-archive.tar.zst
          retention-days: 1
          if-no-files-found: error
      - if: failure() && github.event_name == 'pull_request'
        uses: pyrlyn/ci/.github/actions/cancel-run@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  # T44.4: the agent installers write Windows paths and `%APPDATA%` files; run the suite there.
  # T83.4: a gate like `check` — a Windows-only failure fails the run.
  # The suite run (~250 s) outweighs the build (~85 s) on this runner, so it is split across
  # `partitions` runners with nextest `--partition count:i/n`. `windows-build` archives the test
  # binaries once and every shard runs its share from that archive;
  # the job still fails if any shard fails.
  windows:
    needs: windows-build
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && !inputs.docs-only
    strategy:
      fail-fast: true
      matrix:
        partition: [1, 2]
        partitions: [2]
    name: windows (${{ matrix.partition }}/${{ matrix.partitions }})
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write # cancel-run
    # A hung test is killed by nextest's `terminate-after`; this caps everything else.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Rust toolchain from the last run; mise then skips `rustup toolchain install`.
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive-windows
      - run: >-
          mise exec -- cargo nextest run --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --partition count:${{ matrix.partition }}/${{ matrix.partitions }}
      - if: failure() && github.event_name == 'pull_request'
        uses: pyrlyn/ci/.github/actions/cancel-run@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  # T310.11: the admin SPA in web/ (the `just spa-*` recipes). oxlint and oxfmt already cover
  # web/ in `lint` (`just js` lints every tracked .ts/.tsx), so they are not run twice. The
  # Playwright run against the real binary (T310.10) is a step of the ubuntu `check` job, which
  # already builds that binary. Like `lint`, `check` and `windows` it runs on every change but a
  # docs-only one (`docs` below): a Rust-only change leaves this job warm in cache.
  spa:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && !inputs.docs-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # cancel-run
    env:
      # Node comes from mise below, so the recipes call npm directly instead of `mise exec`,
      # which would also try to install the Rust and Go toolchains of mise.toml.
      NPM: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: just node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # Keyed on the lockfile because it pins the Playwright version, which pins the browser build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: just spa-install
      - run: just spa-browsers
      - run: just spa-typecheck
      - run: just spa-test
      - run: just spa-storybook
      - run: just spa-stories
      - run: just spa-build
      - if: failure() && github.event_name == 'pull_request'
        uses: pyrlyn/ci/.github/actions/cancel-run@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  # Docs-only pull requests skip the jobs above; this one still runs the tests that validate the
  # Markdown (`just docs-check`: plan.md/todo.md ids and Check: lines, ideas.md, docs/ structure,
  # host docs, public numbers, ...). Also on main and manual runs, which keeps its cache warm;
  # not on a pull request with code, where `check` runs the same tests.
  docs:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (inputs.docs-only || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # cancel-run
    env:
      # Rust comes from mise below, so the recipe calls cargo directly instead of `mise exec`,
      # which would also try to install the rest of mise.toml.
      CARGO: cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rust toolchain from the last run; mise then skips `rustup toolchain install`.
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: just rust
      - uses: ./.github/actions/sccache
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: just docs-check
      - if: failure() && github.event_name == 'pull_request'
        uses: pyrlyn/ci/.github/actions/cancel-run@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  # Fails when workspace-hack drifts from the dependency graph (cargo-hakari
  # comes from mise.toml). Own job, so the required check names stay as they are.
  hakari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # Only what the check needs, not every tool in mise.toml.
          install_args: rust cargo:cargo-hakari
      - run: cargo hakari generate --diff
      - run: cargo hakari manage-deps --dry-run
      - run: cargo hakari verify
