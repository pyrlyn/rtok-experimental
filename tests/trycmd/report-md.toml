# rtok report

Window [..] → [..] (30d) · store [..]

## Window

| ledger | rows | covers |
| --- | --- | --- |
| calls | 0 of 0 | window (30d) |
| measurements | 0 | whole ledger (no row times) |
| usage | 0 | whole ledger (no row times) |

**No rows in window.** The store has no rows to report.

## Savings

Estimated tokens from `Measurement` rows only: est_before − est_after, net — an `expand` row counts negative, because retrieval costs tokens. A `Measurement` row carries no turn count, so these are floors, not context-token-turns.

No rows in window.

## Calls

Latency per surface, nearest-rank p50/p95 over the calls that recorded one.

No rows in window.

## Cache

Prompt-cache busts by cause, from the proxy's `usage` rows (whole ledger).

No rows in window.

## Expand

How often a live-zone pointer had to be expanded (`archive_decisions` rows).

No rows in window.

