# Publishes this repo's docs/ to the public site repository pyrlyn/landing (pyrlyn/ci's
# sync-docs.yml): docs/site.md and the localized docs/ru/site.md, docs/uk/site.md become the
# project cards, every other user-facing docs/**/*.md and its ru and uk translations go to
# content/docs/rtok/ (mirrored). Internal pages are left out by the shared filter plus the list
# below. On a v* tag or release the cards' `version:` is set from the tag. Auth: the
# SITE_DEPLOY_KEY deploy key on pyrlyn/landing; GITHUB_TOKEN stays read-only.
# Inputs: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: sync-docs

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every v* tag syncs.
    paths: [docs/**, .github/workflows/sync-docs.yml]
    tags: ["v*"]
  # A tag pushed with GITHUB_TOKEN triggers no workflow, so also sync when a release is published.
  release:
    types: [published]
  workflow_dispatch:

# One sync at a time per source repo, never cancelled half-way.
concurrency:
  group: sync-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    uses: pyrlyn/ci/.github/workflows/sync-docs.yml@main
    permissions:
      contents: read
    with:
      locales: ru uk
      # Internal pages beyond the shared list. architecture/ (T959): the site mirrors only *.md,
      # so those pages would lose their SVG diagrams.
      extra-excludes: |
        batch-flex.md
        llm-soft-compression.md
        model-routing.md
        plugin-plan-template.md
        report.md
        windows.md
        colima.md
        architecture/
    secrets:
      SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
