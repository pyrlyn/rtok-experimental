# The binary crate is the workspace root (T23.1, D25). `rtok-plugin-sdk` is the published
# plugin contract; `fuzz` is the nightly-only cargo-fuzz crate and stays out of `cargo test`.
[workspace]
members = ["crates/rtok-agent-sdk", "crates/rtok-config", "crates/rtok-hook", "crates/rtok-log", "crates/rtok-mcp", "crates/rtok-plugin-sdk", "crates/rtok-store", "crates/rtok-sys", "crates/rtok-wasm-demo-guest", "workspace-hack"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1" # the pin in mise.toml
license = "GPL-3.0-or-later"
repository = "https://github.com/pyrlyn/rtok" # cargo-dist hosting (T10.4)

# External versions shared by more than one member. One line, one reason, so a
# later crate cannot drift the number. Features that differ stay on the member.
[workspace.dependencies]
anyhow = "1.0.104" # Result on the binary, both SDKs, and rtok-mcp
serde = { version = "1.0.229", features = ["derive"] } # contract types and the binary
serde_json = "1.0.151" # JSON values: binary, both SDKs, rtok-mcp
jsonc-parser = "0.34.0" # JSONC: Zed settings (binary) and host configs (rtok-mcp)
toml_edit = "0.25" # in-place TOML: `config set` and rtok-mcp
# One version for the binary's [dependencies] and [dev-dependencies], so the
# tests' second connection cannot drift from the store.
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
rstest = "0.27.0" # parameterized tests in the binary and rtok-agent-sdk
sha2 = "0.11" # checksums: the store, the proxy cache, and otel
dunce = "1" # canonicalize without Windows UNC prefixes (store index keys + the host)
regex = "1" # request-body noise (store) and search/bench patterns (binary)
schemars = "1.2.2" # JSON Schema: store project rows and the /ws protocol
humantime = "2.4" # idle duration: the store and `rtok agents`
uuid = { version = "1.26", features = ["v4"] } # agent ids in the store; already transitive elsewhere
thiserror = "2.0" # public error enums: rtok-store and rtok-config
figment = { version = "0.10", features = ["toml", "env"] } # config layering; the CLI builds flag dicts
change-preview = "0.1.0" # config and file-edit previews, byte sizes (replaces the in-tree diff and bytes renderers)
globset = "0.4" # junk globs and config validation of agents.junk.exclude
url = "2.5" # file:// MCP roots and http(s) checks in config

[workspace.lints.rust]
# Hand-written `unsafe` is rejected. `deny`, not `forbid`: a member cannot mix
# `[lints] workspace = true` with a one-lint override (RFC 3389), and `forbid`
# cannot be relaxed in source. `rtok-sys` and the wasm demo guest are the
# exceptions (`#![allow(unsafe_code)]`). The `rtok` lib, bin, and hook client
# keep `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
# `cargo fuzz` builds with `--cfg fuzzing`; `src/fuzzing.rs` exists only then.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `unsafe_code` covers hand-written code; skip macro-expanded unsafe here.
undocumented_unsafe_blocks = "allow"
dbg_macro = "warn"
todo = "warn"
# Library modules hand text to the surface (`log::stdout` / `log::stderr`). The
# surface modules allow both lints; `just check` denies the warning.
print_stdout = "warn"
print_stderr = "warn"

[package]
name = "rtok"
version = "0.17.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# Both fields are also what dist reads when it builds a Homebrew formula — off today, kept
# commented out in dist-workspace.toml to be fixed later, so leave them in place.
homepage = "https://github.com/pyrlyn/rtok"
license.workspace = true
description = "Token-reduction CLI for AI coding agents: hooks, MCP server and API proxy with pluggable methods"
# T23.6: only `rtok-plugin-sdk` is published. A release of the binary is a tag plus dist
# archives, and `cargo publish` at the workspace level must not reach this package.
publish = false

# Opt the binary back into cargo-dist: publish = false would otherwise hide it from
# `dist generate` / Release (same as cargo-dist's own guidance).
[package.metadata.dist]
dist = true
# Host plugins must ship beside the binary: setup resolves `plugins/<host>` next
# to `current_exe()` for installed archives (Windows zip / unix tarballs).
# The web UI is not here: T111 compiles it into the binary (build.rs), because a ketch
# install keeps only the executable.
# T319: share/ (man pages, completion scripts) is generated by .github/build-setup.yml
# (tools/share-files.sh) before `dist build`; locally `just share`.
include = ["plugins/", "skills/", "share/"]

[[bin]]
name = "rtok"
path = "src/main.rs"

# T178/D32: the std-only hook client; a bin of this package so it shares rtok's version.
[[bin]]
name = "rtok-hook"
path = "src/bin/rtok-hook.rs"

[[bench]]
name = "graph"
harness = false

[features]
# One feature per catalogue plugin (plan T0.4). Default = all.
default = ["measure", "cmd", "read", "json_tree", "archive", "proxy", "inject", "guard", "memory", "docs", "graph", "toon", "compress"]
measure = []
cmd = []
read = ["dep:tree-sitter", "dep:tree-sitter-tags", "lang-rust", "lang-ts", "lang-js", "lang-python", "lang-dart", "lang-c", "lang-go", "lang-java", "lang-kotlin", "lang-swift", "lang-csharp", "lang-ruby", "lang-php"]
archive = []
json_tree = ["toon", "archive"]
proxy = []
inject = []
guard = []
memory = []
docs = []
graph = ["read", "dep:resvg", "dep:base64"]
toon = []
wasm-host = ["dep:wasmi"]
compress = []
lang-rust = ["dep:tree-sitter-rust"]
lang-ts = ["dep:tree-sitter-typescript"]
lang-js = ["dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-dart = ["dep:tree-sitter-dart"]
lang-c = ["dep:tree-sitter-c"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-swift = ["dep:tree-sitter-swift"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-php = ["dep:tree-sitter-php"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
rtok-plugin-sdk = { version = "0.0.1", path = "crates/rtok-plugin-sdk" } # the plugin contract (D25)
rtok-store = { version = "0.0.1", path = "crates/rtok-store" } # SQLite store (Diesel stays in that crate)
rtok-config = { version = "0.0.1", path = "crates/rtok-config" } # figment layers, toml edits, the reference file
rtok-agent-sdk = { version = "0.0.1", path = "crates/rtok-agent-sdk" }   # the agent-host contract (D28)
rtok-mcp = { version = "0.0.1", path = "crates/rtok-mcp" } # per-surface MCP status (T278) from the one lookup T277 owns
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.6" # `rtok completions` (T53.2)
clap_mangen = "0.3" # `rtok man` (T53.2)
figment = { workspace = true } # config layering + per-key provenance (D14)
rtok-log = { version = "0.0.1", path = "crates/rtok-log" } # rotating text log, reusable outside this binary
rtok-sys = { version = "0.0.1", path = "crates/rtok-sys" } # demon kill/setsid + flock (Windows-safe shims; rustix stays inside rtok-sys on Unix)
rtok-hook = { version = "0.0.1", path = "crates/rtok-hook" } # T178/D31: wire format shared with the std-only hook client
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true } # JSON Schema of the /ws protocol, TS types generated from it (T310.2)
shlex = "2.0.1" # POSIX word splitting of a hook command, to find the file it runs (T331.1)
sha2 = { workspace = true } # call_io archive checksums (T13.3); the store crate owns the writer
change-preview = { workspace = true } # unified diff, colour and byte sizes for `--dry-run` output
wasmi = { version = "2.0", optional = true } # pure-Rust WASM interpreter for optional out-of-tree plugin host (P32)
toml_edit = { workspace = true } # `config set` (T12.3) edits in place, preserving comments
toml = "0.8" # Cargo.lock [[package]] parse for docs_resolve (already in the lock via figment)
zstd = "0.13" # decode docs.rs crate rustdoc JSON (.json.zst) for `rtok docs fetch`
dunce = { workspace = true } # canonicalize without Windows UNC prefixes (graph index keys + file:// URIs)
pathdiff = "0.2" # relative path of a file under a repo root (graph LSP + index)
rmcp = { version = "3.2", features = ["transport-streamable-http-server"] } # stdio MCP types + JSON-RPC (T4.1); the SDK's Streamable HTTP server for `rtok mcp --http` (T401)
subtle = "2.6" # constant-time bearer-token compare for `rtok mcp --http` (T401); already in the tree via rustls
url = { workspace = true } # file:// MCP roots → path (T263)
ignore = "0.4" # gitignore-aware walk for search/tree (T4.5)
globset = { workspace = true } # workspace member globs of project references (T329.7)
serde-saphyr = "1.3.0" # `pnpm-workspace.yaml` of project references (T329.7); maintained, serde_yaml is deprecated
notify = "9.0.0-rc.5" # recursive file watching for the graph background indexer (T8.16); 9 drops windows-sys 0.60 (T223)
indicatif = "0.18" # progress for `graph index` (T21.2); `ProgressBar::hidden()` keeps it off the MCP path
owo-colors = { version = "4", features = ["supports-colors"] } # ANSI + the tty/NO_COLOR/CLICOLOR/TERM=dumb question in one call (T20.2)
unicode-width = "0.2" # measure each operation icon so its column pads to one width, as ketch does (T436); already in the tree through indicatif
printpdf = "0.12.8" # paged-PDF renderer for `rtok report --format pdf` (T22.0 survey choice, T22.3)
regex = { workspace = true } # search pattern (T4.5)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
axum = { version = "0.8.9", features = ["ws"] } # dashboard WebSocket (P19); proxy HTTP unchanged
rust-embed = { version = "8.12", default-features = false, features = ["debug-embed", "interpolate-folder-path"] } # the React SPA inside the binary, every profile (T310.9)
mime_guess = "2" # Content-Type for the SPA's files, embedded or read from RTOK_WEB_DIST
futures-util = "0.3.34"
ratatui = "0.30.2" # `rtok tui`, the terminal rendering of the D23 model (T15.1); default backend is crossterm
inquire = { version = "0.9", default-features = false, features = ["crossterm"] } # `rtok completions` shell picker (T408): maintained (0.9.4, 2026-02), most-used prompt crate; shares the crossterm 0.29 copy below, no fuzzy/macros
crossterm = "0.29" # key and tick events for the TUI loop (T15.1); same major as ratatui 0.30's backend, so one copy links
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls", "blocking"] } # blocking: the sync task adapters (T441.7)
rustls = "0.23" # preconfigured webpki TLS for proxy/otel (T53.3)
rustls-pemfile = "2.2" # SSL_CERT_FILE bundle parsing (T53.3)
webpki-roots = "1" # Mozilla roots without the platform verifier (T53.3)
tree-sitter = { version = "0.25", optional = true } # parser for map/signatures (T4.3)
tree-sitter-tags = { version = "0.25", optional = true } # definition tags from grammar queries (T4.3)
tree-sitter-rust = { version = "0.24.2", optional = true } # lang-rust tags (T4.3)
tree-sitter-javascript = { version = "0.25", optional = true } # lang-js tags (T4.3)
tree-sitter-typescript = { version = "0.23", optional = true } # lang-ts tags (T4.3)
tree-sitter-python = { version = "0.25", optional = true } # lang-python tags (T4.3)
tree-sitter-c = { version = "0.24", optional = true } # lang-c tags (T4.3)
tree-sitter-go = { version = "0.25", optional = true } # lang-go tags (T4.3)
tree-sitter-dart = { version = "0.2", optional = true } # lang-dart tags (T4.3)
tree-sitter-java = { version = "0.23.5", optional = true } # lang-java tags (T52.2)
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true } # lang-kotlin tags (T52.2); fwcd 0.3.8 needs tree-sitter <0.23
tree-sitter-swift = { version = "0.7.3", optional = true } # lang-swift tags (T52.2)
tree-sitter-c-sharp = { version = "0.23.5", optional = true } # lang-csharp tags (T52.2)
tree-sitter-ruby = { version = "0.23.1", optional = true } # lang-ruby tags (T52.2)
tree-sitter-php = { version = "0.24.2", optional = true } # lang-php tags (T52.2)
jsonc-parser = { workspace = true, features = ["serde"] } # JSONC (comments + trailing commas) parse of Zed settings (T222)
log = "0.4.34" # T225: logging facade; env_logger drains it, every D26 line is mirrored into it
env_logger = "0.11.11" # T225: `RUST_LOG` debug log on stderr; the filter defaults to `off`, not `error`
semver = { version = "1.0", features = ["serde"] } # T279: plugin version compare + version-file (de)serialization; already in the lock as a transitive dep
uuid = { workspace = true } # T282: the rtok agent id (D34, random so short prefixes are unique)
humantime = { workspace = true } # T282 review: [agents] idle parsing, replacing a hand-rolled duplicate of measure::stats::parse_since
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] } # T330.4: `agents junk clear --trash` to the macOS Trash, freedesktop trash and Recycle Bin; chrono (metadata listing only) left off
jiff = "0.2" # T358: IANA time zones with DST for `rtok agents usage` day and month buckets (`--tz`); already in the lock as a transitive dep of env_logger
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"], optional = true } # T329.31: `rtok graph export --format png` rasterises the drawn SVG; pure Rust, no raster-images/memmap-fonts
base64 = { version = "0.23.1", optional = true } # T329.40: the graph page receives a PNG export inside a text frame; already in the lock
workspace-hack = { version = "0.1", path = "workspace-hack" }

[dev-dependencies]
rtok-store = { path = "crates/rtok-store", features = ["test-util"] } # store test helpers; off the library build
assert_cmd = "2" # CLI e2e through `Command::cargo_bin` (plan Working agreement)
divan = "0.1" # divan benches in benches/ (default harness for new benches)
httpmock = "0.8" # mock Anthropic/OpenAI upstreams for proxy tests (T5.0)
insta = "1" # snapshot tests for stable text output
proptest = "1" # T331.5: byte-for-byte guarantee of `doctor --fix` edits over generated JSONC (doctor/fix.rs)
jsonschema = { version = "0.58", default-features = false } # T329.16: validates the `graph export` JSON against its committed schema file (no network, no resolvers)
portable-pty = "0.9" # T331.7: drives the `doctor --fix` checklist on a real pseudo-terminal (tests/doctor_checklist_pty.rs)
rstest = { workspace = true } # parameterized unit tests; #[rstest] instead of #[test] (T36.5)
trycmd = "1.2.1" # full CLI command-output fixtures in tests/trycmd/
pulldown-cmark = { version = "0.13", default-features = false } # CommonMark parse of README/docs in tests/docs_structure.rs (T359): unclosed fences, skipped heading levels
tokio-tungstenite = "0.30" # real WebSocket client for the `rtok web` e2e (tests/web_e2e.rs); already in the tree via axum "ws"
# T17.1. No profile may set `panic = "abort"`: `hooks::dispatch` fails open through five
# `catch_unwind` sites, and aborting would break the rule that a hook exits 0 on error.
[profile.dev]
# Backtraces keep `file:line`; the full DWARF that dominated every artifact goes.
debug = "line-tables-only"

# Nobody steps through the 450-odd dependencies, but their debug info is copied into every
# one of the integration test binaries (one per file under tests/*.rs), which is most of
# what the linker moves on a dev rebuild. Workspace code is not matched by `"*"`, so it
# keeps its line tables.
[profile.dev.package."*"]
debug = false

# Build scripts and proc macros are run, not debugged.
[profile.dev.build-override]
debug = false

[profile.release]
strip = "symbols"

# The profile that 'dist' will build with: `dev`, so every release is a dev build
# (unoptimized, line tables, no LTO).
[profile.dist]
inherits = "dev"
