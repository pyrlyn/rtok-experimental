bin.name = "rtok"
args = "completions bash --install --dry-run"
status.code = 0
stdout = """
--- a/[..]/completions/rtok
+++ b/[..]/completions/rtok
...
"""
stderr = ""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t4164-completions-install-dry-run"
RTOK_HOME = "target/tmp/t4164-completions-install-dry-run"
