ref or working (default)","type":"string"}},"type":"object"},"name":"graph_diff"},{"annotations":{"readOnlyHint":true},"description":"The graph as redacted rtok.graph.v1 JSON.","inputSchema":{"properties":{"depth":{"type":"integer"},"focus":{"description":"symbol; with depth","type":"string"},"level":{"description":"overview (default) or symbols","type":"string"},"project":{"type":"string"}},"type":"object"},"name":"graph_export"}]}}
