[plugins.memory.embed]
# enabled    = false                    # P29: FTS5-only when false; vector search is opt-in
# provider   = "local"                  # "local" | "openai"
# model      = "all-MiniLM-L6-v2"
# dimensions = 384
# hybrid     = true                     # when enabled: RRF(fts5, knn) for mem_search and prompt_recall; the hook reads stored vectors only; false = knn only

[plugins.graph]
# enabled    = true
# max_tokens = 2000                     # per response; beyond it: head + "N more, expand <id>"
# impact_tokens = 1500                  # impact: files grouped and ranked up to this budget, then "+K files, M refs not shown"; --all or 0 = every row
# map_tokens = 0                        # SessionStart repo map cap (counts toward the injection budget next to memory.recall_tokens); 0 = off
# map_rank   = "refs"                   # SessionStart map order: refs = references per name; pagerank = files by personalized PageRank, personalized by recently edited files and the last checkpoint after a compact
# body_lines = 40                       # symbol(): source lines shown per definition
# auto_index = true                     # every symbol/callers/impact call walks the tree; false = index once, then `rtok graph index` or the watcher
# backend    = "tags"                   # tags | lsp | auto | text: tags = tree-sitter index (default); lsp = language server from PATH, tags when it cannot answer; auto = per project and language, server first, tags second, text search when no grammar parses the project; text = in-process text search only (no call graph, no dead)
# lsp_timeout_ms = 40000                # how long one language-server wait (starting, still indexing) may take before the request falls back to tags
# backend_by_language = {}              # backend for one language, e.g. { go = "tags", rust = "lsp" }
# watch      = "off"                    # off | notify (P8d): background re-index inside `rtok mcp`
# auto_link_references = true           # follow references in manifests (Cargo path, npm file:/link:, go replace, Python path, submodules) into other directories, register and auto-link them
# reference_depth = 3                   # reference levels followed from the project (A -> B is 1); reaching it is shown and logged
# max_auto_projects = 20                # most projects references may add to the registry; reaching it is shown and logged
# alerts = true                         # alert when a project in the scope is missing, unreachable, has its backend down or a broken manifest link; shown by rtok doctor, graph projects and graph answers
# health_check_interval_s = 60          # seconds between health checks in rtok mcp and rtok web (an alert needs two in a row); 0 = off
# live_heat_window_s = 300              # seconds a node stays warm on the live graph canvas after a call (rtok web, rtok tui)
# live_max_events_per_s = 50            # most call events the live panel lists per second; the counters still count every call
# live_feed_rows = 200                  # finished calls the live feed keeps
# exclude    = []                       # gitignore-style paths dropped from the walk
# include    = []                       # gitignore-style paths forced back in
# extensions = {}                       # ext = "grammar" remap for custom suffixes

