# T255: every test runs with `HOME` (and `USERPROFILE` on Windows) under `target/test-home`, so
# a path that slips past `Config` lands there instead of in this machine's `~/.claude` or
# `~/.codex`. A setup script, not cargo's `[env]`, which would reach `cargo run` too. The tool
# homes keep their real values so `rustup`, `rust-analyzer` and `mise where` still find the
# toolchain; tests that commit pass their own git `user.*`. Each run starts from an empty home.
# T280: `RTOK_HOST_SANDBOX` hides every agent installed on this machine (CLIs on PATH, apps in
# `/Applications` and the like): rtok sees only hosts under `HOME`, i.e. a test's own fakes.
experimental = ["setup-scripts"]

[scripts.setup.test-home-unix]
command = ['sh', '-c', '''
h="$PWD/target/test-home" && rm -rf "$h" && mkdir -p "$h" && {
  echo "HOME=$h"
  echo "RTOK_HOST_SANDBOX=1"
  echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
  echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}"
  echo "MISE_DATA_DIR=${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}"
  echo "MISE_CONFIG_DIR=${MISE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/mise}"
  echo "MISE_STATE_DIR=${MISE_STATE_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/mise}"
} >> "$NEXTEST_ENV"
''']

# LF-only lines: `Add-Content` would end each with CRLF and the `\r` would stay in the value.
[scripts.setup.test-home-windows]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', '''
$h = Join-Path (Get-Location) "target\test-home"
Remove-Item -Recurse -Force -ErrorAction SilentlyContinue -Path $h
New-Item -ItemType Directory -Force -Path $h | Out-Null
$c = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
$r = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE ".rustup" }
[IO.File]::AppendAllText($env:NEXTEST_ENV, "HOME=$h`nUSERPROFILE=$h`nRTOK_HOST_SANDBOX=1`nCARGO_HOME=$c`nRUSTUP_HOME=$r`n")
''']

[[profile.default.scripts]]
platform = { host = "cfg(unix)" }
setup = "test-home-unix"

[[profile.default.scripts]]
platform = { host = "cfg(windows)" }
setup = "test-home-windows"

# Windows CI previously hung forever in `cargo nextest` after the wasm LNK stubs
# landed (run 35225713659 job windows: nextest still in_progress after >2h;
# earlier Windows jobs failed at link in ~5m and never reached the suite).
# Mark slow at 60s; kill after 3 periods so a stuck wait_with_output/test is named
# in the log instead of holding the runner until the GHA 6h ceiling.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# CPU/memory-heavy tests run alone. `threads-required = "num-test-threads"` makes each
# matching test reserve the whole `--test-threads` pool (see `just test`, which sets `-j`
# to the system CPU count), so a heavy test never shares the machine with the rest of the
# suite. The three below are the ones that swamp a box:
#   - labelled_symbols_are_found  cold-indexes the whole repo; its `each_parsed` walk
#                                 already spawns one worker per core.
#   - memory_recall_bench          seeds a 100-session in-memory store (P29 embeddings).
#   - the graph_bench pair         build 3 000-file trees. They are `#[ignore]` release
#                                 benches (their headers ask for `--test-threads=1`), so the
#                                 override only bites under `--run-ignored`.
[[profile.default.overrides]]
filter = 'test(/labelled_symbols_are_found/)'
threads-required = "num-test-threads"
# Symbol spans and symbols_fts make the cold index and the rank walk heavier.
# Windows debug CI crossed the 180s kill (3x60s) while still printing rank lines.
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'test(/memory_recall_bench/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'test(/p8c_numbers|p8c_one_edit_reads_one_file_under_10ms/)'
threads-required = "num-test-threads"


# T143: fires 20 real `rtok hook Stop` subprocesses against a delayed collector and samples
# how many stay alive (via a trace dir the test owns, not `ps`). A loaded box can genuinely
# push concurrency past the coalescing bound by starving the queued child's `flock` wait, not
# just skew a measurement — isolate it like the benches above so the sample means something.
[[profile.default.overrides]]
filter = 'test(/hook_spawned_flushes_coalesce_to_at_most_two_processes/)'
threads-required = "num-test-threads"

# T237: times one 230 KB skill digest including its archive write, which the Windows runner's
# NTFS stretched from 270 ms (run 35591648404) to 1685 ms (run 35960806447) under suite load.
# Alone, the number is the code's, not its neighbours' I/O.
[[profile.default.overrides]]
filter = 'test(/oversized_body_is_denied_with_map_and_pointer_under_budget/)'
threads-required = "num-test-threads"

# T309: bounds the locked hook at half the holder's 500 ms hold. The shared suite stretched it to
# 102 ms on `macos-latest` and 313 ms on `windows-latest` (2026-09-27, both green on rerun).
# Alone, the time is the hook's.
[[profile.default.overrides]]
filter = 'test(/hook_returns_despite_exclusive_lock/)'
threads-required = "num-test-threads"

# trycmd spawns the real rtok binary for every case; under a full-suite parallel run its
# output drifted 3x on 2026-09-20/21 (fast, load-only failures; green standalone and in
# CI). Isolate the runner on the machine like the heavy benches above -- each case still
# runs, just not sharing CPUs with the rest of the suite.
[[profile.default.overrides]]
filter = 'binary(cli_trycmd)'
threads-required = "num-test-threads"

# Installs, lists and removes every host in turn: ~100 sequential `rtok` spawns, each `agents
# list` probing all hosts. 8 s on the Windows runner, ~50 s alone on a loaded dev box, and it
# hit the 180 s `terminate-after` there once the rest of the suite shared the CPUs (2026-09-26).
# Alone, the time is the test's own, not its neighbours'.
[[profile.default.overrides]]
filter = 'test(/list_reports_installed_modules_per_host/)'
threads-required = "num-test-threads"

# Every test that spawns `rtok mcp` (a stdio server with a watcher, health and retention thread
# each) shares this group. On the 4-vCPU Windows runner, a dozen of them next to the heavy tests
# stretched a 0.3 s exchange to 7-10 s and failed `mcp_with_watcher_exits_on_stdin_eof` and
# `mcp_moves_into_the_first_file_root_after_roots_list` (run 38073132494). Two at a time keeps
# the other threads for the rest of the suite.
[test-groups]
mcp-spawn = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'binary(/^mcp(_agent_messages|_agents|_call_lsp_orphan|_http|_ping|_wrap)?$/)'
test-group = "mcp-spawn"

# CI (`NEXTEST_PROFILE=ci`, set in ci.yml): one flake must not cancel the other shard and the
# macOS job (run 38073132494 lost ~10 min of green work to two timing failures), and a test that
# passes on retry is reported FLAKY in the log instead of failing the gate. Two retries, not
# more: a test that fails three times in a row is broken. Local runs keep the default profile,
# where a flake stays visible.
[profile.ci]
retries = 2
fail-fast = false
