# T18.2 (P18). The only entry point for a release: raise the version, land it through a pull
# request, tag the commit that landed and start the dist Release workflow for it. Nobody types
# a version number, and nothing else creates a `v*` tag.
#
# pyrlyn/ci's bump.yml runs `tools/release.sh <level> --local` (one `release: vX.Y.Z` commit),
# pushes it to `release/bump-vX.Y.Z` and opens a PR into main with RELEASE_PLZ_TOKEN, so the PR's
# own CI runs and reports the required `gate` check. Once it is green, bump rebase-merges the PR
# with GITHUB_TOKEN (no ruleset bypass), reads back the commit that landed on main, tags it,
# creates a draft Release and dispatches release.yml (dist, `create-release = false`) on the tag,
# which uploads the archives and undrafts it. Red checks, a timeout or a failed merge close the
# PR: no tag, no Release. `dry-run` stops after the checks and closes the PR.
# The preview stays local: `tools/release.sh <level> --dry-run`. See docs/release.md.
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      level:
        description: which part of the version to raise, if the current one is already released
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: open the version PR and wait for its checks, then close it (no tag, no release)
        default: false
        type: boolean
      release-untagged-head:
        description: release the untagged version already on main (nothing to commit) as it stands
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bump:
    uses: pyrlyn/ci/.github/workflows/bump.yml@341896b491b89d93a1940313c0149ddfd8fae9c2 # main
    permissions:
      contents: write # the bump branch, the tag and the Release
      pull-requests: write # merge or close the bump PR
      actions: write # dispatch release.yml (and pipeline.yml for release-untagged-head)
      checks: read # wait for the required checks
      statuses: read
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      level: ${{ inputs.level }}
      dry-run: ${{ inputs.dry-run }}
      release-untagged-head: ${{ inputs.release-untagged-head }}
      # Regular Releases only: a stable version is never published as a prerelease, and the
      # Releases list carries no "dev build" entries (a `-` version is the only prerelease).
      prerelease: false
      release-script: tools/release.sh
      mise-install-args: rust git-cliff
      # Reports `gate` (the protect-main required check) when dispatched.
      ci-workflows: pipeline.yml
      release-workflows: release.yml
    secrets:
      BUMP_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
