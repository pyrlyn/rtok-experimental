bin.name = "rtok"
args = "--config tests/trycmd/input/bench-config.toml config set proxy.port 8791 --dry-run"
stdout = """
--- a/tests/trycmd/input/bench-config.toml
+++ b/tests/trycmd/input/bench-config.toml
@@ -3,3 +3,6 @@
 [bench]
 tasks = "bench/tasks.toml"
 runs = 3
+
+[proxy]
+port = 8791
1 file changed, 3 insertions(+)
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t60-2-config-set"
RTOK_HOME = "target/tmp/t60-2-config-set"
