bin.name = "rtok"
args = "graph projects unlink 9999 --from 9998 --dry-run"
status.code = 1
stdout = ""
stderr = """
Error: no project `9998`; see `rtok graph projects`
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t4164-graph-projects-unlink-dry-run"
RTOK_HOME = "target/tmp/t4164-graph-projects-unlink-dry-run"
